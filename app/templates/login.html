{% extends "base.html" %}
{% block auth_content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-brand"><i class="fa-solid fa-train-subway"></i></div>
    <h2>Welcome Back</h2>
    <p class="auth-sub">Sign in to your RailSmart account</p>

    <form method="POST" class="auth-form">
      <div class="form-group">
        <label>Username</label>
        <div class="input-icon">
          <i class="fa-solid fa-user"></i>
          <input type="text" name="username" placeholder="Enter username" required />
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-icon">
          <i class="fa-solid fa-lock"></i>
          <input type="password" name="password" placeholder="Enter password" required />
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>

    <p class="auth-foot">Don't have an account? <a href="{{ url_for('main.register') }}">Register</a></p>
    <div class="auth-hint">Demo Admin → <code>admin</code> / <code>admin123</code></div>
  </div>
</div>
{% endblock %}
