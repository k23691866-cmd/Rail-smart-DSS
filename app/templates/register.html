{% extends "base.html" %}
{% block auth_content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-brand"><i class="fa-solid fa-train-subway"></i></div>
    <h2>Create Account</h2>
    <p class="auth-sub">Join RailSmart DSS today</p>

    <form method="POST" class="auth-form">
      <div class="form-group">
        <label>Username</label>
        <div class="input-icon">
          <i class="fa-solid fa-user"></i>
          <input type="text" name="username" placeholder="Choose a username" required minlength="3" />
        </div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <div class="input-icon">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" name="email" placeholder="you@example.com" required />
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-icon">
          <i class="fa-solid fa-lock"></i>
          <input type="password" name="password" placeholder="Min 6 characters" required minlength="6" />
        </div>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <div class="input-icon">
          <i class="fa-solid fa-lock"></i>
          <input type="password" name="confirm_password" placeholder="Repeat password" required minlength="6" />
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Register</button>
    </form>

    <p class="auth-foot">Already have an account? <a href="{{ url_for('main.login') }}">Login</a></p>
  </div>
</div>
{% endblock %}
